      <script>
        (() => {
          const box = document.getElementById("rc-wave");
          const N = 48;
          for (let i = 0; i < N; i++) {
            const b = document.createElement("div");
            b.className = "rc-bar";
            b.style.left = i * (830 / (N - 1)) + "px";
            box.appendChild(b);
          }
          const bars = box.querySelectorAll(".rc-bar");
          const noise = (i, k) => {
            const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
            return s - Math.floor(s);
          };
          const pad = (n) => String(n).padStart(2, "0");
          const clock = (s) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(Math.floor(s % 60))}`;

          const tl = gsap.timeline({ paused: true });
          gsap.set("#rc-v-rec, #rc-st-rec", { opacity: 1 });
          gsap.set(bars, { scaleY: 0.08 });
          gsap.set("#rc-progress i", { scaleX: 0 });
          gsap.set("#rc-cursor", { x: 1960, y: 1120 });

          tl.fromTo("#rc-win", { scale: 0.86, y: 60, filter: "blur(10px)" }, { scale: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0);

          for (let k = 0; k < 22; k++) {
            bars.forEach((b, i) => {
              const centre = 1 - Math.abs(i - (N - 1) / 2) / N;
              tl.to(b, { scaleY: 0.08 + 0.92 * centre * (0.15 + 0.85 * noise(i, k)), duration: 0.1, ease: "sine.inOut" }, 0.05 + k * 0.1);
            });
          }
          tl.to(bars, { scaleY: 0.08, duration: 0.15, ease: "power2.out" }, 2.25);

          const timerEl = document.getElementById("rc-timer");
          const t = { s: 761 };
          tl.to(t, { s: 3134, duration: 2.1, ease: "power1.in", onUpdate: () => (timerEl.textContent = clock(t.s)) }, 0.05);

          tl.to("#rc-cursor", { x: 1360, y: 800, duration: 0.6, ease: "power3.out" }, 1.3);
          tl.to("#rc-stop", { scale: 0.97, duration: 0.06 }, 2.15);
          tl.to("#rc-cursor", { scale: 0.86, transformOrigin: "0 0", duration: 0.06 }, 2.15);
          tl.to("#rc-stop", { scale: 1, duration: 0.2, ease: "expo.out" }, 2.22);
          tl.to("#rc-cursor", { scale: 1, duration: 0.12 }, 2.22);
          tl.to("#rc-cursor", { x: 1700, y: 960, duration: 0.5, ease: "power2.inOut" }, 2.5);

          tl.to("#rc-v-rec", { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.2, ease: "power3.in" }, 2.3);
          tl.to("#rc-st-rec", { opacity: 0, duration: 0.1 }, 2.4);
          tl.to("#rc-st-proc", { opacity: 1, duration: 0.15 }, 2.45);
          tl.fromTo("#rc-v-proc", { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 2.45);

          const pctEl = document.getElementById("rc-pct");
          const p = { v: 0 };
          tl.to(p, { v: 100, duration: 2.1, ease: "power1.inOut", onUpdate: () => (pctEl.textContent = Math.round(p.v) + " %") }, 2.6);
          tl.to("#rc-progress i", { scaleX: 1, duration: 2.1, ease: "power1.inOut" }, 2.6);
          document.querySelectorAll(".rc-step").forEach((s, i) => {
            const at = 2.8 + i * 0.45;
            tl.to(s, { color: "#26212c", duration: 0.12 }, at - 0.3);
            tl.fromTo(s.querySelector(".rc-step-fill"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at);
          });

          tl.to("#rc-v-proc", { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.2, ease: "power3.in" }, 4.95);
          tl.to("#rc-st-proc", { opacity: 0, duration: 0.1 }, 5.05);
          tl.to("#rc-st-ok", { opacity: 1, duration: 0.15 }, 5.1);
          tl.fromTo("#rc-v-done", { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 5.1);
          tl.fromTo("#rc-badge", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 5.15);
