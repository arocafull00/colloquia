<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Inter, sans-serif;
        }
        #pv-ground {
          position: absolute;
          inset: 0;
          background: #26212c;
        }
        .pv-line {
          position: absolute;
          left: 160px;
          right: 160px;
          margin: 0;
          font-size: 168px;
          font-weight: 900;
          letter-spacing: -0.045em;
          line-height: 180px;
        }
        #pv-l1 {
          top: 120px;
        }
        #pv-l2 {
          top: 300px;
        }
        .pv-line span {
          display: inline-block;
          margin-right: 0.22em;
          color: #3b3442;
        }
        #pv-sub {
          position: absolute;
          left: 164px;
          top: 528px;
          margin: 0;
          font-size: 42px;
          font-weight: 700;
          letter-spacing: -0.01em;
          color: #9d94a6;
          opacity: 0;
        }
        #pv-bars {
          position: absolute;
          left: 160px;
          top: 660px;
          width: 1600px;
          height: 280px;
        }
        .pv-bar {
          position: absolute;
          top: 0;
          width: 14px;
          height: 280px;
          border-radius: 7px;
          background: #c9b9d6;
        }
      </style>

      <div id="root" data-composition-id="privacy" data-width="1920" data-height="1080">
        <div id="pv-ground" class="clip" data-start="0" data-duration="3.5" data-track-index="0"></div>
        <div id="pv-stage" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
          <h2 class="pv-line" id="pv-l1"><span>Nada</span><span>sale</span></h2>
          <h2 class="pv-line" id="pv-l2"><span>de</span><span class="pv-acc">tu</span><span class="pv-acc">consulta</span></h2>
          <p id="pv-sub">Sin nube · Sin telemetría · Funciona sin internet</p>
          <div id="pv-bars"></div>
        </div>
      </div>

      <script>
        (() => {
          const box = document.getElementById("pv-bars");
          const N = 48;
          for (let i = 0; i < N; i++) {
            const b = document.createElement("div");
            b.className = "pv-bar";
            b.style.left = i * (1586 / (N - 1)) + "px";
            box.appendChild(b);
          }
          const barEls = box.querySelectorAll(".pv-bar");
          const noise = (i, k) => {
            const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
            return s - Math.floor(s);
          };
          const MIN = 0.05;

          const tl = gsap.timeline({ paused: true });
          gsap.set(barEls, { scaleY: MIN });

          const steps = 28;
          for (let k = 0; k < steps; k++) {
            const env = Math.min(1, (k + 1) / 4) * (k > 18 ? Math.max(0, (steps - k) / 9) : 1);
            barEls.forEach((b, i) => {
              const centre = 1 - Math.abs(i - (N - 1) / 2) / N;
              const v = MIN + (1 - MIN) * env * centre * (0.2 + 0.8 * noise(i, k + 7));
              tl.to(b, { scaleY: v, duration: 0.1, ease: "sine.inOut" }, 0.05 + k * 0.1);
            });
          }
          tl.to(barEls, { scaleY: MIN, duration: 0.2, ease: "power2.out" }, 2.85);

          const words = document.querySelectorAll(".pv-line span");
          words.forEach((w, i) => {
            const target = w.classList.contains("pv-acc") ? "#c9b9d6" : "#f4f1ec";
            tl.to(w, { color: target, duration: 0.12, ease: "power2.out" }, 0.25 + i * 0.1);
          });
          tl.fromTo("#pv-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.1);

          tl.to(".pv-line, #pv-sub", { opacity: 0, filter: "blur(12px)", duration: 0.18, ease: "power2.in" }, 3.25);

          window.__timelines["privacy"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
