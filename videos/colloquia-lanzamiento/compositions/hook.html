<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Inter, sans-serif;
        }
        #hk-ground {
          position: absolute;
          inset: 0;
          background: #f4f1ec;
        }
        #hk-btn {
          position: absolute;
          left: 560px;
          top: 250px;
          width: 800px;
          height: 200px;
          border-radius: 40px;
          background: #ffffff;
          box-shadow: 0 2px 4px rgba(38, 33, 44, 0.08), 0 40px 80px rgba(38, 33, 44, 0.16);
        }
        #hk-btn-red {
          position: absolute;
          inset: 0;
          border-radius: 40px;
          background: #e5484d;
          opacity: 0;
        }
        .hk-face {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 36px;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #26212c;
        }
        #hk-face-rec {
          font-size: 88px;
        }
        #hk-face-rec i {
          width: 52px;
          height: 52px;
          border-radius: 50%;
          background: #e5484d;
        }
        #hk-face-timer {
          font-size: 104px;
          font-weight: 300;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.03em;
          opacity: 0;
        }
        #hk-face-timer i {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: #e5484d;
          box-shadow: 0 0 0 14px rgba(229, 72, 77, 0.18);
        }
        #hk-face-stop {
          font-size: 88px;
          color: #ffffff;
          opacity: 0;
        }
        #hk-face-stop b {
          width: 56px;
          height: 56px;
          border-radius: 12px;
          background: #ffffff;
        }
        .hk-word {
          position: absolute;
          left: 0;
          right: 0;
          top: 560px;
          margin: 0;
          text-align: center;
          font-size: 200px;
          font-weight: 900;
          letter-spacing: -0.05em;
          line-height: 220px;
          color: #26212c;
          opacity: 0;
        }
        #hk-w3 {
          color: #493c55;
        }
        #hk-lockup {
          position: absolute;
          left: 384px;
          top: 250px;
          width: 1152px;
          height: 307px;
        }
        #hk-lockup svg {
          display: block;
          width: 100%;
          height: 100%;
          fill: #493c55;
          overflow: visible;
        }
        #hk-tag {
          position: absolute;
          left: 0;
          right: 0;
          top: 640px;
          margin: 0;
          text-align: center;
          font-size: 64px;
          font-weight: 700;
          letter-spacing: -0.025em;
          color: #26212c;
        }
        #hk-tag span {
          display: inline-block;
          margin: 0 0.12em;
          opacity: 0;
        }
        #hk-tag .accent {
          color: #493c55;
        }
        #hk-cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 52px;
          height: 72px;
          z-index: 5;
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <div id="hk-ground" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
        <div id="hk-stage" class="clip" data-start="0" data-duration="5" data-track-index="1" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="hk-btn">
            <div id="hk-btn-red"></div>
            <div class="hk-face" id="hk-face-rec"><i></i>Grabar</div>
            <div class="hk-face" id="hk-face-timer"><i></i><span id="hk-timer">00:00:00</span></div>
            <div class="hk-face" id="hk-face-stop"><b></b>Detener</div>
          </div>
          <h2 class="hk-word" id="hk-w1">Graba.</h2>
          <h2 class="hk-word" id="hk-w2">Atiende.</h2>
          <h2 class="hk-word" id="hk-w3">Lee.</h2>
          <div id="hk-lockup">
            <svg viewBox="0 0 960 256" aria-label="Colloquia">
              <defs>
                <clipPath id="hk-wm-clip"><rect id="hk-wm-rect" x="215" y="0" width="0" height="256" /></clipPath>
              </defs>
              <g transform="translate(0 16) scale(.78)">
                <g id="hk-q1"><path d="M40 48 H108 V116 H72 C72 145 83 164 108 180 V212 C61 193 40 164 40 116 Z" /></g>
                <g id="hk-q2"><g transform="translate(256 256) scale(-1 -1)"><path d="M40 48 H108 V116 H72 C72 145 83 164 108 180 V212 C61 193 40 164 40 116 Z" /></g></g>
              </g>
              <g clip-path="url(#hk-wm-clip)">
                <g transform="translate(226 53) scale(1.65)">
                  <path d="M59 15 C52 5 42 0 29 0 C10 0 0 16 0 38 C0 60 10 76 29 76 C42 76 53 70 60 60 L52 53 C46 62 39 65 30 65 C17 65 11 55 11 38 C11 21 17 11 30 11 C39 11 46 15 51 22 Z" fill-rule="evenodd" />
                  <g transform="translate(72 0)"><path d="M0 49 a23 28 0 1 0 46 0 a23 28 0 1 0 -46 0 Z M10 49 a13 18 0 1 0 26 0 a13 18 0 1 0 -26 0 Z" fill-rule="evenodd" /></g>
                  <path d="M130 0 H140 V60 Q140 66 146 66 H149 V76 H145 Q130 76 130 60 Z" fill-rule="evenodd" />
                  <path d="M161 0 H171 V60 Q171 66 177 66 H180 V76 H176 Q161 76 161 60 Z" fill-rule="evenodd" />
                  <g transform="translate(192 0)"><path d="M0 49 a23 28 0 1 0 46 0 a23 28 0 1 0 -46 0 Z M10 49 a13 18 0 1 0 26 0 a13 18 0 1 0 -26 0 Z" fill-rule="evenodd" /></g>
                  <g transform="translate(250 0)"><path d="M0 49 a23 28 0 1 0 46 0 a23 28 0 1 0 -46 0 Z M10 49 a13 18 0 1 0 26 0 a13 18 0 1 0 -26 0 Z" fill-rule="evenodd" /><rect x="36" y="23" width="10" height="73" /></g>
                  <path d="M308 23 H318 V54 Q318 67 331 67 Q344 67 344 54 V23 H354 V76 H345 V69 Q339 78 329 78 Q308 78 308 55 Z" fill-rule="evenodd" />
                  <rect x="366" y="23" width="10" height="53" />
                  <rect x="366" y="3" width="10" height="10" rx="3" />
                  <g transform="translate(390 0)"><path d="M0 49 a23 28 0 1 0 46 0 a23 28 0 1 0 -46 0 Z M10 49 a13 18 0 1 0 26 0 a13 18 0 1 0 -26 0 Z" fill-rule="evenodd" /><rect x="36" y="23" width="10" height="53" /></g>
                </g>
              </g>
            </svg>
          </div>
          <h2 id="hk-tag"><span>Tus</span><span>sesiones,</span><span>transcritas</span><span class="accent">sin</span><span class="accent">nube</span></h2>
          <svg id="hk-cursor" viewBox="0 0 26 36">
            <path d="M2 2 L2 29 L9 22.5 L13.5 33 L18 31 L13.6 20.8 L23 20.8 Z" fill="#26212c" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const pad = (n) => String(n).padStart(2, "0");
          const clock = (s) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(Math.floor(s % 60))}`;
          const timerEl = document.getElementById("hk-timer");

          gsap.set("#hk-cursor", { x: 1180, y: 520 });
          gsap.set("#hk-w1", { opacity: 1 });
          gsap.set("#hk-lockup", { x: 456, opacity: 0 });
          gsap.set("#hk-q1", { x: -700 });
          gsap.set("#hk-q2", { x: 700 });

          tl.to("#hk-cursor", { x: 1010, y: 380, duration: 0.35, ease: "power3.out" }, 0);
          tl.to("#hk-btn", { scale: 0.96, duration: 0.06, ease: "power2.out" }, 0.4);
          tl.to("#hk-cursor", { scale: 0.86, transformOrigin: "0 0", duration: 0.06 }, 0.4);
          tl.to("#hk-btn", { scale: 1, duration: 0.25, ease: "expo.out" }, 0.48);
          tl.to("#hk-cursor", { scale: 1, duration: 0.12 }, 0.48);
          tl.to("#hk-face-rec", { opacity: 0, filter: "blur(10px)", duration: 0.12, ease: "power2.in" }, 0.46);
          tl.fromTo("#hk-face-timer", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.52);
          const counter = { s: 0 };
          tl.to(counter, { s: 3134, duration: 1.4, ease: "power2.in", onUpdate: () => (timerEl.textContent = clock(counter.s)) }, 0.6);

          tl.to("#hk-w1", { opacity: 0, filter: "blur(12px)", duration: 0.14, ease: "power2.in" }, 0.8);
          tl.fromTo("#hk-w2", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.92);

          tl.to("#hk-cursor", { x: 1040, y: 400, duration: 0.3, ease: "power2.inOut" }, 1.55);
          tl.to("#hk-btn", { scale: 0.96, duration: 0.06 }, 1.95);
          tl.to("#hk-cursor", { scale: 0.86, duration: 0.06 }, 1.95);
          tl.to("#hk-btn", { scale: 1, duration: 0.25, ease: "expo.out" }, 2.03);
          tl.to("#hk-cursor", { scale: 1, duration: 0.12 }, 2.03);
          tl.to("#hk-btn-red", { opacity: 1, duration: 0.12, ease: "power2.out" }, 2.0);
          tl.to("#hk-face-timer", { opacity: 0, filter: "blur(10px)", duration: 0.1, ease: "power2.in" }, 2.0);
          tl.fromTo("#hk-face-stop", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.06);

          tl.to("#hk-w2", { opacity: 0, filter: "blur(12px)", duration: 0.14, ease: "power2.in" }, 2.0);
          tl.fromTo("#hk-w3", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.12);

          tl.to("#hk-cursor", { x: 1500, y: 1180, duration: 0.4, ease: "power3.in" }, 2.35);
          tl.to("#hk-btn", { scale: 0.2, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, 2.4);
          tl.to("#hk-w3", { y: 80, opacity: 0, filter: "blur(14px)", duration: 0.28, ease: "power3.in" }, 2.4);

          tl.set("#hk-lockup", { opacity: 1 }, 2.55);
          tl.to("#hk-q1", { x: 0, duration: 0.42, ease: "expo.out" }, 2.55);
          tl.to("#hk-q2", { x: 0, duration: 0.42, ease: "expo.out" }, 2.55);
          tl.to("#hk-lockup", { x: 0, duration: 0.55, ease: "power4.inOut" }, 2.95);
          tl.to("#hk-wm-rect", { attr: { width: 760 }, duration: 0.55, ease: "power4.inOut" }, 3.0);

          document.querySelectorAll("#hk-tag span").forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 3.3 + i * 0.067);
          });

          tl.to("#hk-lockup, #hk-tag", { opacity: 0, filter: "blur(14px)", scale: 0.94, duration: 0.25, ease: "power3.in" }, 4.78);

          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
