name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  WHISPER_CPP_VERSION: v1.9.5
  VULKAN_VERSION: 1.4.357.0
  WHISPER_CPP_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
    -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Versión
        shell: bash
        run: echo "COLLOQUIA_VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.$GITHUB_RUN_NUMBER)" >> $GITHUB_ENV
      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: whisper.cpp (Vulkan)
        run: |
          curl.exe -sSLo "$env:RUNNER_TEMP/vulkansdk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP/vulkansdk.exe" -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          $env:VULKAN_SDK = "C:\VulkanSDK"
          git clone -q --depth 1 -b $env:WHISPER_CPP_VERSION https://github.com/ggml-org/whisper.cpp "$env:RUNNER_TEMP/wsrc"
          cmake -S "$env:RUNNER_TEMP/wsrc" -B "$env:RUNNER_TEMP/wb" $env:WHISPER_CPP_FLAGS.Split(" ") -DGGML_VULKAN=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build "$env:RUNNER_TEMP/wb" --config Release -j 4 --target whisper-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "WHISPER_CLI=$env:RUNNER_TEMP/wb/bin/Release/whisper-cli.exe" >> $env:GITHUB_ENV
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/colloquia.spec
      - name: Prueba de arranque
        run: |
          dist\Colloquia\colloquia-cli.exe --help
          if (-not (Test-Path dist\Colloquia\_internal\whisper-cpp\whisper-cli.exe)) { throw "Falta whisper-cli.exe" }
      - name: Instalador
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:COLLOQUIA_VERSION" "/DOutputName=Colloquia-$env:COLLOQUIA_VERSION-windows-setup" packaging\colloquia.iss
      - uses: actions/upload-artifact@v4
        with:
          name: colloquia-windows
          path: dist/*-setup.exe
          compression-level: 0

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Versión
        run: echo "COLLOQUIA_VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.$GITHUB_RUN_NUMBER)" >> $GITHUB_ENV
      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: whisper.cpp (Metal)
        run: |
          git clone -q --depth 1 -b $WHISPER_CPP_VERSION https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/wsrc"
          cmake -S "$RUNNER_TEMP/wsrc" -B "$RUNNER_TEMP/wb" $WHISPER_CPP_FLAGS -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_CXX_FLAGS="-include algorithm"
          cmake --build "$RUNNER_TEMP/wb" -j 4 --target whisper-cli
          echo "WHISPER_CLI=$RUNNER_TEMP/wb/bin/whisper-cli" >> $GITHUB_ENV
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/colloquia.spec
      - name: Prueba de arranque
        run: |
          find dist/Colloquia.app -name whisper-cli -type f | grep -q . || { echo "Falta whisper-cli"; exit 1; }
          plutil -extract NSMicrophoneUsageDescription raw dist/Colloquia.app/Contents/Info.plist
          dist/Colloquia.app/Contents/MacOS/Colloquia --help
      - name: DMG
        run: |
          mkdir dmg
          ditto dist/Colloquia.app dmg/Colloquia.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Colloquia -srcfolder dmg -ov -format UDZO "dist/Colloquia-$COLLOQUIA_VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: colloquia-macos
          path: dist/*.dmg
          compression-level: 0

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Versión
        run: echo "COLLOQUIA_VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.$GITHUB_RUN_NUMBER)" >> $GITHUB_ENV
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libvulkan-dev
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: whisper.cpp (Vulkan)
        run: |
          curl -sSL "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          export VULKAN_SDK="$RUNNER_TEMP/$VULKAN_VERSION/x86_64" PATH="$RUNNER_TEMP/$VULKAN_VERSION/x86_64/bin:$PATH"
          git clone -q --depth 1 -b $WHISPER_CPP_VERSION https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/wsrc"
          cmake -S "$RUNNER_TEMP/wsrc" -B "$RUNNER_TEMP/wb" $WHISPER_CPP_FLAGS -DGGML_VULKAN=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_CXX_FLAGS="-include algorithm" -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build "$RUNNER_TEMP/wb" -j 4 --target whisper-cli
          ldd "$RUNNER_TEMP/wb/bin/whisper-cli"
          echo "WHISPER_CLI=$RUNNER_TEMP/wb/bin/whisper-cli" >> $GITHUB_ENV
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/colloquia.spec
      - name: Prueba de arranque
        run: |
          test -x dist/Colloquia/_internal/whisper-cpp/whisper-cli
          dist/Colloquia/Colloquia --help
      - name: Tarball
        run: tar -C dist -czf "dist/Colloquia-$COLLOQUIA_VERSION-linux-x86_64.tar.gz" Colloquia
      - name: AppImage
        run: |
          mkdir AppDir
          cp -a dist/Colloquia/. AppDir/
          cp packaging/colloquia.png packaging/colloquia.desktop AppDir/
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/Colloquia" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir "dist/Colloquia-$COLLOQUIA_VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: colloquia-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Instaladores con nombre fijo
        run: |
          cp artifacts/*-windows-setup.exe artifacts/Colloquia-Windows-Setup.exe
          cp artifacts/*-linux-x86_64.AppImage artifacts/Colloquia-Linux.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
